<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>练习 - 表达研究所</title>
  <link rel="stylesheet" href="css/style.css?v=20260903b" />
</head>
<body class="page page--practice">
  <header class="practice-header">
    <a href="index.html" class="back-link">← 返回</a>
    <div class="practice-mode-wrap">
      <p class="practice-mode">话题聊天</p>
      <p id="practice-timer" class="practice-timer" aria-live="polite">00:00</p>
    </div>
    <a href="profile.html" class="header-profile-link">我的</a>
  </header>

  <!-- 话题卡片（B 模式 自言自语 时隐藏） -->
  <section id="topic-section" class="topic-section">
    <div class="topic-section-head">
      <p class="eyebrow" id="topic-eyebrow">今日话题</p>
      <button id="btn-change-topic" type="button" class="btn-link btn-link--muted" hidden>↻ 换题</button>
    </div>
    <h2 id="topic-title" class="topic-title">聊聊你最近看过的一部电影或剧，你为什么想看它，看完有什么感受？</h2>
    <p id="topic-hint" class="topic-hint" hidden></p>
  </section>

  <section class="waveform-section">
    <p id="record-hint" class="record-hint">点击下方按钮开始说话</p>
    <div class="waveform-area">
      <canvas id="waveform" aria-label="录音波形"></canvas>
    </div>
    <p id="live-transcript" class="live-transcript" aria-live="polite"></p>
  </section>

  <footer class="record-footer">
    <!-- 录音前 / 录音中 -->
    <div id="record-primary-actions">
      <button id="btn-record" type="button" class="btn-record-circle" aria-pressed="false">
        <span class="btn-record-label">开始录音</span>
      </button>
    </div>

    <!-- 录音停止后：确认页 -->
    <div id="post-record-actions" class="post-record-actions" hidden>
      <audio id="audio-preview" controls class="audio-preview" hidden></audio>
      <div class="post-record-btns">
        <button id="btn-rerecord" type="button" class="btn btn--secondary">↺ 重录</button>
        <button id="btn-submit" type="button" class="btn btn--primary">✓ 提交分析</button>
      </div>
    </div>
  </footer>

  <!-- 提交分析：分阶段 Loading 遮罩 -->
  <div id="submission-overlay" class="overlay" hidden>
    <div class="overlay-panel">
      <div class="overlay-spinner" aria-hidden="true"></div>
      <h3 class="overlay-title" id="overlay-title">转写中</h3>
      <p class="overlay-desc" id="overlay-desc">正在把语音整理成文字…</p>
      <ol class="overlay-steps" id="overlay-steps">
        <li data-step="transcribe" class="is-current">
          <span class="step-bullet"></span>
          <span class="step-label">语音转写</span>
        </li>
        <li data-step="analyze">
          <span class="step-bullet"></span>
          <span class="step-label">五维评分</span>
        </li>
        <li data-step="improvement">
          <span class="step-bullet"></span>
          <span class="step-label">生成建议</span>
        </li>
      </ol>
      <button id="overlay-cancel" type="button" class="btn-link">取消 / 稍后再看</button>
    </div>
  </div>

  <script src="js/topics.js?v=20260903"></script>
  <script src="js/storage.js?v=20260903"></script>
  <script src="js/idb.js?v=20260903"></script>
  <script src="js/api.js?v=20260903"></script>
  <script src="js/recorder.js?v=20260903"></script>
  <script src="js/app.js?v=20260903"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { App.initPractice(); });
  </script>
</body>
</html>
