<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 表达研究所</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page page--profile">
    <header class="page-header page-header--with-right">
      <a href="index.html" class="back-link">← 返回首页</a>
      <h1 class="page-title">个人中心</h1>
      <a href="profile.html" class="header-profile-link" style="visibility:hidden;">占位</a>
    </header>

    <!-- 空状态 -->
    <section id="profile-empty" class="profile-empty" hidden>
      <p class="placeholder-text">还没有练习记录，先去练一次吧！</p>
      <button id="empty-go-home" class="btn btn--primary" type="button">去练习</button>
    </section>

    <!-- 主体内容 -->
    <section id="profile-content" class="profile-content" hidden>
      <!-- ① 统计概览 -->
      <section class="section-block">
        <h2 class="section-title">统计概览</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="stat-count">0</span>
            <span class="stat-label">有效练习</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-minutes">0</span>
            <span class="stat-label">累计分钟</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-streak">0</span>
            <span class="stat-label">连续天数</span>
          </div>
        </div>
      </section>

      <!-- ② 近5次平均雷达图 -->
      <section class="section-block">
        <h2 class="section-title"><span id="avg-radar-title">近 5 次平均</span></h2>
        <div class="chart-wrap chart-wrap--radar">
          <canvas id="avg-radar"></canvas>
        </div>
      </section>

      <!-- ③ 成长曲线 -->
      <section class="section-block">
        <h2 class="section-title">成长曲线</h2>
        <div class="chart-wrap chart-wrap--line">
          <canvas id="growth-chart"></canvas>
        </div>
      </section>

      <!-- ④ 练习记录列表 -->
      <section class="section-block">
        <h2 class="section-title">练习记录</h2>
        <div class="record-list" id="record-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/idb.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { App.initProfilePage(); });
  </script>
</body>
</html>
